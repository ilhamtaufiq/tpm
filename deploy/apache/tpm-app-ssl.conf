<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName tpm.cianjur.space
    ServerAlias tpm.test

    DocumentRoot /var/www/tpm-frontend

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/tpm.cianjur.space/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tpm.cianjur.space/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Directory /var/www/tpm-frontend>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket endpoint must be matched before the generic /api rule.
    ProxyPass /api/v1/realtime/ws ws://127.0.0.1:8000/api/v1/realtime/ws retry=0
    ProxyPassReverse /api/v1/realtime/ws ws://127.0.0.1:8000/api/v1/realtime/ws

    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api

    ProxyPass /docs http://127.0.0.1:8000/docs
    ProxyPassReverse /docs http://127.0.0.1:8000/docs

    ProxyPass /openapi.json http://127.0.0.1:8000/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:8000/openapi.json

    ErrorLog ${APACHE_LOG_DIR}/tpm-app-error.log
    CustomLog ${APACHE_LOG_DIR}/tpm-app-access.log combined
</VirtualHost>
</IfModule>
