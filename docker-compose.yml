version: '3.8'

services:
  # Database Service
  db:
    image: mysql:8.0
    container_name: tpm_mysql
    restart: always
    environment:
      MYSQL_DATABASE: tpm_db
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Jakarta
    ports:
      - "3307:3306" # Using 3307 to avoid conflict with local MySQL (Laragon)
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tpm_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=tpm_db
      - DB_USER=root
      - DB_PASSWORD=root
      - APP_NAME=TPM Backend
      - DEBUG=True
      - ENVIRONMENT=production
      - TZ=Asia/Jakarta
      - JWT_SECRET_KEY=change-this-in-production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1,https://tpm.cianjur.space
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Frontend Service (Expo Web + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tpm_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # Cloudflare Tunnel Service
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tpm_tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - frontend

volumes:
  mysql_data:
